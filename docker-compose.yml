services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ./.tradingagents:/home/appuser/.tradingagents
      - ./reports:/home/appuser/app/reports
      - ./研报:/home/appuser/app/研报
    tty: true
    stdin_open: true

  tradingagents-workbench:
    build: .
    restart: unless-stopped
    entrypoint: []
    command: ["python", "-m", "frontend.server"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/home/appuser/app
      - TRADINGAGENTS_WORKBENCH_HOST=0.0.0.0
      - TRADINGAGENTS_WORKBENCH_PORT=8080
      - TRADINGAGENTS_WORKBENCH_CONCURRENCY=3
      - TRADINGAGENTS_WORKBENCH_USER_CONCURRENCY=2
    volumes:
      - ./:/home/appuser/app
      - ./.tradingagents:/home/appuser/.tradingagents
    ports:
      - "8080:8080"
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - ./.tradingagents:/home/appuser/.tradingagents
      - ./reports:/home/appuser/app/reports
      - ./研报:/home/appuser/app/研报
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  ollama_data:
